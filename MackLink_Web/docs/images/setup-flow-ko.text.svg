<circle cx="719" cy="669" r="2" fill="#087A59"/>
<circle cx="728" cy="669" r="2" fill="#087A59"/>
<circle cx="737" cy="669" r="2" fill="#087A59"/>
<text x="112" y="378" fill="#1D3830" font-family="NanumGothic,sans-serif" font-size="32" font-weight="700" text-anchor="start">Mac을 등록합니다</text>
<text x="112" y="427" fill="#617469" font-family="NanumGothic,sans-serif" font-size="22" font-weight="400" text-anchor="start">www.maclink.cloud에서 Google로 로그인합니다.</text>
<text x="112" y="465" fill="#617469" font-family="NanumGothic,sans-serif" font-size="22" font-weight="400" text-anchor="start">Mac 등록 후 DMG와 기기 연결 키를 내려받습니다.</text>
<text x="112" y="503" fill="#617469" font-family="NanumGothic,sans-serif" font-size="22" font-weight="400" text-anchor="start">기기 연결 키는 자신의 Mac에 보관합니다.</text>
<text x="972" y="378" fill="#1D3830" font-family="NanumGothic,sans-serif" font-size="32" font-weight="700" text-anchor="start">앱을 설치하고 연결합니다</text>
<text x="972" y="427" fill="#617469" font-family="NanumGothic,sans-serif" font-size="22" font-weight="400" text-anchor="start">DMG의 앱을 응용 프로그램에 설치·실행합니다.</text>
<text x="972" y="465" fill="#617469" font-family="NanumGothic,sans-serif" font-size="22" font-weight="400" text-anchor="start">설정에서 기기 연결 키를 가져옵니다.</text>
<text x="972" y="503" fill="#617469" font-family="NanumGothic,sans-serif" font-size="22" font-weight="400" text-anchor="start">화면·오디오 기록 / 기기 제어를 허용합니다.</text>
<text x="972" y="758" fill="#1D3830" font-family="NanumGothic,sans-serif" font-size="32" font-weight="700" text-anchor="start">다른 컴퓨터에서 로그인합니다</text>
<text x="972" y="807" fill="#617469" font-family="NanumGothic,sans-serif" font-size="23" font-weight="400" text-anchor="start">브라우저에서 www.maclink.cloud를 엽니다.</text>
<text x="972" y="845" fill="#617469" font-family="NanumGothic,sans-serif" font-size="23" font-weight="400" text-anchor="start">Mac을 등록한 Google 계정으로 로그인합니다.</text>
<text x="972" y="883" fill="#617469" font-family="NanumGothic,sans-serif" font-size="23" font-weight="400" text-anchor="start">내 기기에 등록된 Mac이 표시됩니다.</text>
<text x="112" y="758" fill="#1D3830" font-family="NanumGothic,sans-serif" font-size="32" font-weight="700" text-anchor="start">내 기기에서 접속합니다</text>
<text x="112" y="807" fill="#617469" font-family="NanumGothic,sans-serif" font-size="23" font-weight="400" text-anchor="start">온라인인 Mac에서 연결 버튼을 누릅니다.</text>
<text x="112" y="845" fill="#617469" font-family="NanumGothic,sans-serif" font-size="23" font-weight="400" text-anchor="start">보기 전용 또는 제어 범위를 선택합니다.</text>
<text x="112" y="883" fill="#617469" font-family="NanumGothic,sans-serif" font-size="23" font-weight="400" text-anchor="start">원격 화면과 시스템 소리가 전달됩니다.</text>
<path d="M 820 390 H 940" fill="none" stroke="#087A59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 1310 530 V 630" fill="none" stroke="#087A59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 940 770 H 820" fill="none" stroke="#087A59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<rect x="80" y="960" width="1600" height="185" rx="24" fill="#EAF2E5"/>
<text x="112" y="1008" fill="#087A59" font-family="NanumGothic,sans-serif" font-size="27" font-weight="700" text-anchor="start">등록한 기기는 같은 Google 계정으로 로그인해야 접속할 수 있습니다.</text>
<text x="112" y="1051" fill="#617469" font-family="NanumGothic,sans-serif" font-size="22" font-weight="400" text-anchor="start">Mac이 깨어 있고 로그인·인터넷 연결 상태이며, 권한이 허용된 Connector가 실행 중이어야 합니다.</text>
<text x="112" y="1085" fill="#617469" font-family="NanumGothic,sans-serif" font-size="22" font-weight="400" text-anchor="start">설정에서 로그인 시 MacLink 실행을 선택할 수 있습니다.</text>
<text x="112" y="1119" fill="#617469" font-family="NanumGothic,sans-serif" font-size="22" font-weight="400" text-anchor="start">로그아웃, 연결 종료 또는 커넥터 중지로 접속을 끝낼 수 있습니다.</text>
<path d="M 80 1206 H 1680" fill="none" stroke="#D9E2D7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="1241" fill="#617469" font-family="NanumGothic,sans-serif" font-size="18" font-weight="400" text-anchor="start">MacLink · fivebellhyun · 1.3.2</text>
<text x="1680" y="1241" fill="#617469" font-family="NanumGothic,sans-serif" font-size="18" font-weight="400" text-anchor="end">구조도  /  03</text>
</svg>