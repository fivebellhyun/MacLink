<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1220" viewBox="0 0 1760 1220" role="img" aria-labelledby="title desc">
<title id="title">MacLink 연결 경로 선택</title><desc id="desc">Automatic WebRTC selection, one optional TURN TLS-only retry, then a connection failure notice if no route works.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8AA58C"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087A59"/></marker></defs>
<rect x="0" y="0" width="1760" height="1220" rx="0" fill="#F6F7F2"/>
<text x="80" y="70" fill="#087A59" font-family="NanumGothic,sans-serif" font-size="19" font-weight="700" text-anchor="start">연결 경로</text>
<text x="80" y="134" fill="#1D3830" font-family="NanumGothic,sans-serif" font-size="46" font-weight="700" text-anchor="start">WebRTC로 직접 연결하거나 TURN을 사용합니다.</text>
<text x="80" y="183" fill="#617469" font-family="NanumGothic,sans-serif" font-size="24" font-weight="400" text-anchor="start">자동 모드는 사용 가능한 경로를 선택하며, 연결 성공 여부는 네트워크 정책에 따라 달라집니다.</text>
<rect x="80" y="230" width="1600" height="90" rx="20" fill="#EAF2E5"/>
<text x="112" y="267" fill="#087A59" font-family="NanumGothic,sans-serif" font-size="24" font-weight="700" text-anchor="start">「TURN/TLS 443만 사용」을 선택하면 02단계에서 시작합니다.</text>
<text x="112" y="300" fill="#617469" font-family="NanumGothic,sans-serif" font-size="19" font-weight="400" text-anchor="start">TURN 키가 등록되어 있지 않으면 자동 모드는 02단계를 건너뜁니다.</text>
<rect x="80" y="370" width="460" height="255" rx="24" fill="#FFFFFF" stroke="#D9E2D7" stroke-width="2"/>
<rect x="650" y="370" width="460" height="255" rx="24" fill="#FFFFFF" stroke="#D9E2D7" stroke-width="2"/>
<rect x="1220" y="370" width="460" height="255" rx="24" fill="#FFFFFF" stroke="#D9E2D7" stroke-width="2"/>
<rect x="112" y="397" width="74" height="42" rx="21" fill="#EAF2E5"/>
<text x="149.0" y="426" fill="#087A59" font-family="NanumGothic,sans-serif" font-size="19" font-weight="700" text-anchor="middle">01</text>
<text x="112" y="485" fill="#1D3830" font-family="NanumGothic,sans-serif" font-size="29" font-weight="700" text-anchor="start">자동 · WebRTC</text>
<text x="112" y="532" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">직접 연결 후보와 등록된 TURN</text>
<text x="112" y="566" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">경로를 함께 수집합니다.</text>
<text x="112" y="600" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">ICE가 동작하는 후보 쌍을 선택합니다.</text>
<rect x="682" y="397" width="74" height="42" rx="21" fill="#EAF2E5"/>
<text x="719.0" y="426" fill="#087A59" font-family="NanumGothic,sans-serif" font-size="19" font-weight="700" text-anchor="middle">02</text>
<text x="682" y="485" fill="#1D3830" font-family="NanumGothic,sans-serif" font-size="27" font-weight="700" text-anchor="start">TURN/TLS 443 only</text>
<text x="682" y="532" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">실패하면 중계 전용으로 한 번 재시도.</text>
<text x="682" y="566" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">TURN 키 등록이 필요합니다.</text>
<text x="682" y="600" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">같은 경로를 반복 재시도하지 않습니다.</text>
<rect x="1252" y="397" width="74" height="42" rx="21" fill="#F7F0E7"/>
<text x="1289.0" y="426" fill="#986536" font-family="NanumGothic,sans-serif" font-size="19" font-weight="700" text-anchor="middle">03</text>
<text x="1252" y="485" fill="#1D3830" font-family="NanumGothic,sans-serif" font-size="27" font-weight="700" text-anchor="start">연결 실패 안내</text>
<text x="1252" y="532" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">두 WebRTC 경로 모두 연결되지 않으면</text>
<text x="1252" y="566" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">오류를 안내하고 세션을 종료합니다.</text>
<text x="1252" y="600" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">네트워크를 확인한 뒤 다시 접속하세요.</text>
<path d="M 540 495 H 650" fill="none" stroke="#8AA58C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="595" y="465" fill="#617469" font-family="NanumGothic,sans-serif" font-size="18" font-weight="400" text-anchor="middle">실패</text>
<path d="M 1110 495 H 1220" fill="none" stroke="#8AA58C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1165" y="465" fill="#617469" font-family="NanumGothic,sans-serif" font-size="18" font-weight="400" text-anchor="middle">실패</text>
<path d="M 310 625 V 704" fill="none" stroke="#087A59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 880 625 V 704" fill="none" stroke="#087A59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<rect x="80" y="720" width="460" height="180" rx="24" fill="#EAF2E5"/>
<rect x="650" y="720" width="460" height="180" rx="24" fill="#EAF2E5"/>
<rect x="1220" y="720" width="460" height="180" rx="24" fill="#F7F0E7"/>
<text x="112" y="766" fill="#087A59" font-family="NanumGothic,sans-serif" font-size="25" font-weight="700" text-anchor="start">WebRTC로 연결</text>
<text x="112" y="813" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">직접 연결 또는 TURN 중계 연결</text>
<text x="112" y="850" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">영상·시스템 소리 + 제어 데이터 채널</text>
<text x="682" y="766" fill="#087A59" font-family="NanumGothic,sans-serif" font-size="24" font-weight="700" text-anchor="start">TURN/TLS로 연결</text>
<text x="682" y="813" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">브라우저 → TURN 구간은 TLS 443</text>
<text x="682" y="850" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">Mac 측 연결 경로도 필요합니다.</text>
<text x="1252" y="766" fill="#986536" font-family="NanumGothic,sans-serif" font-size="25" font-weight="700" text-anchor="start">네트워크 설정 확인</text>
<text x="1252" y="813" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">TURN 키와 방화벽 정책을 확인하세요.</text>
<text x="1252" y="850" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">허용된 다른 네트워크를 사용해 보세요.</text>
<rect x="80" y="940" width="1600" height="148" rx="24" fill="#F7F0E7"/>
<text x="112" y="986" fill="#986536" font-family="NanumGothic,sans-serif" font-size="25" font-weight="700" text-anchor="start">TURN/TLS 443 연결도 네트워크 정책의 영향을 받습니다.</text>
<text x="112" y="1029" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">프록시·방화벽·관리형 브라우저는 TURN을 차단할 수 있습니다. 이 설정이 네트워크 정책을 우회하지는 않습니다.</text>
<text x="112" y="1063" fill="#617469" font-family="NanumGothic,sans-serif" font-size="21" font-weight="400" text-anchor="start">호환되는 연결 경로가 있을 때 빠른 전송이 가능합니다.</text>
<path d="M 80 1126 H 1680" fill="none" stroke="#D9E2D7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="1161" fill="#617469" font-family="NanumGothic,sans-serif" font-size="18" font-weight="400" text-anchor="start">MacLink · fivebellhyun · 1.3.2</text>
<text x="1680" y="1161" fill="#617469" font-family="NanumGothic,sans-serif" font-size="18" font-weight="400" text-anchor="end">구조도  /  02</text>
</svg>