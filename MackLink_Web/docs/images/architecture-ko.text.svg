<text x="80" y="134" fill="#1D3830" font-family="NanumGothic,sans-serif" font-size="46" font-weight="700" text-anchor="start">내 계정으로 연결하는 암호화된 WebRTC.</text>
<text x="80" y="183" fill="#617469" font-family="NanumGothic,sans-serif" font-size="24" font-weight="400" text-anchor="start">같은 Google 계정으로 접속하며, 화면·소리·입력은 WebRTC 또는 선택적 TURN으로 전송합니다.</text>
