<text x="112" y="378" fill="#1D3830" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start">Register your Mac</text>
<text x="112" y="427" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start">Sign in with Google at www.maclink.cloud.</text>
<text x="112" y="465" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start">Add your Mac; download the DMG and device key.</text>
<text x="112" y="503" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start">Keep the device key on your own Mac.</text>
<text x="972" y="378" fill="#1D3830" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start">Install and connect</text>
<text x="972" y="427" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start">Install the DMG app in Applications and launch it.</text>
<text x="972" y="465" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start">Import the device key in Settings.</text>
<text x="972" y="503" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start">Allow Screen/audio recording and Device control.</text>
<text x="972" y="758" fill="#1D3830" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start">Sign in on another computer</text>
<text x="972" y="807" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start">Open www.maclink.cloud in a browser.</text>
<text x="972" y="845" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start">Sign in to the same Google account.</text>
<text x="972" y="883" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start">Your registered Macs appear in My devices.</text>
<text x="112" y="758" fill="#1D3830" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" text-anchor="start">Connect from My devices</text>
<text x="112" y="807" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start">Choose Connect on your online Mac.</text>
<text x="112" y="845" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start">Select view-only or control mode.</text>
<text x="112" y="883" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start">Receive the screen and system sound.</text>
<path d="M 820 390 H 940" fill="none" stroke="#087A59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 1310 530 V 630" fill="none" stroke="#087A59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 940 770 H 820" fill="none" stroke="#087A59" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<rect x="80" y="960" width="1600" height="185" rx="24" fill="#EAF2E5"/>
<text x="112" y="1008" fill="#087A59" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" text-anchor="start">Only the same signed-in Google account can connect.</text>
<text x="112" y="1051" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start">Keep the Mac awake, logged in, online and running the Connector with permissions enabled.</text>
<text x="112" y="1085" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start">Optional: enable Start MacLink at login in Settings.</text>
<text x="112" y="1119" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" text-anchor="start">Sign out, disconnect or stop the Connector to end remote access.</text>
<path d="M 80 1206 H 1680" fill="none" stroke="#D9E2D7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="1241" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start">MacLink · fivebellhyun · 1.3.2</text>
<text x="1680" y="1241" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="end">Schematic  /  03</text>
</svg>