<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1300" viewBox="0 0 1760 1300" role="img" aria-labelledby="title desc">
<title id="title">MacLink setup flow</title><desc id="desc">Mac registration, permissions, same Google account sign-in and My devices remote access.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8AA58C"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087A59"/></marker></defs>
<rect x="0" y="0" width="1760" height="1300" rx="0" fill="#F6F7F2"/>
<text x="80" y="70" fill="#087A59" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start">GETTING STARTED</text>
<text x="80" y="134" fill="#1D3830" font-family="DejaVu Sans,sans-serif" font-size="46" font-weight="700" text-anchor="start">Register your Mac. Sign in anywhere.</text>
<text x="80" y="183" fill="#617469" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400" text-anchor="start">The Mac runs a native Connector; the remote user only needs a supported browser.</text>
